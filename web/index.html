<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Progressive Jewellery storefront and stockroom app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Progressive Jewellery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Progressive Jewellery</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body, html, img, canvas, .flutter-view {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-drag: none !important;
    }

    @media print {
      body, html, img, canvas, .flutter-view {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    }

    #security-shield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #111111;
      color: #D4AF37;
      z-index: 99999999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 20px;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .content-obscured {
      filter: blur(30px) opacity(0) !important;
      transition: filter 0.1s ease;
    }
  </style>

  <script>
    function showSecurityShield(message) {
      var shield = document.getElementById('security-shield');
      if (shield) {
        if (message) {
          var msgElem = document.getElementById('shield-msg');
          if (msgElem) msgElem.innerText = message;
        }
        shield.style.display = 'flex';
      }
      document.body.classList.add('content-obscured');
    }

    function hideSecurityShield() {
      var shield = document.getElementById('security-shield');
      if (shield) shield.style.display = 'none';
      document.body.classList.remove('content-obscured');
    }

    // Disable right-click context menu
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    }, false);

    // Disable copy & cut
    document.addEventListener('copy', function(e) { e.preventDefault(); }, false);
    document.addEventListener('cut', function(e) { e.preventDefault(); }, false);

    // Intercept print screen & screenshot key combinations
    window.addEventListener('keydown', function(e) {
      if (
        e.key === 'PrintScreen' ||
        (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'P' || e.key === 'S')) ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
        (e.metaKey && e.shiftKey && (e.key === '3' || e.key === '4' || e.key === '5'))
      ) {
        e.preventDefault();
        e.stopPropagation();
        if (navigator.clipboard) {
          navigator.clipboard.writeText('');
        }
        showSecurityShield('Screenshots & Screen Captures are Restricted');
        setTimeout(hideSecurityShield, 2000);
        return false;
      }
    }, true);

    window.addEventListener('keyup', function(e) {
      if (e.key === 'PrintScreen') {
        if (navigator.clipboard) {
          navigator.clipboard.writeText('');
        }
        showSecurityShield('Screenshots & Screen Captures are Restricted');
        setTimeout(hideSecurityShield, 2000);
      }
    }, true);

    // Obscure web view when window loses focus or Snipping Tool / Screenshot app takes focus
    window.addEventListener('blur', function() {
      showSecurityShield('Protected Content');
    });

    window.addEventListener('focus', function() {
      hideSecurityShield();
    });

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        showSecurityShield('Protected Content');
      } else {
        hideSecurityShield();
      }
    });
  </script>
</head>
<body>
  <div id="security-shield">
    <div style="font-size: 36px; margin-bottom: 12px;">🛡️</div>
    <div id="shield-msg" style="font-size: 20px; font-weight: bold; letter-spacing: 1.2px;">Protected Content</div>
    <div style="font-size: 13px; color: #aaaaaa; margin-top: 8px; font-family: Arial, sans-serif;">Screenshots, screen recording, and copying are disabled on this store.</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
